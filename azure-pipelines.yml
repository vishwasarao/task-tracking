# Docker
# Build a Docker image
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  tag: '$(Build.BuildId)'
  vmImage: 'ubuntu-latest'
  dotnetSdkVersion: '9.x'
  solution: '**/*.sln'
  publishOutput: '$(Build.ArtifactStagingDirectory)'
  artifactName: 'drop'
  testResultsDir: '$(Pipeline.Workspace)/test-results'
  imageRepository: 'myrepo/tasktracker'
  acrServiceConnection: 'azure-container-registry'
  pushImage: 'true'
  dockerFilePath: 'src/TaskTracker.Api/Dockerfile'

stages:
- stage: Build_project
  jobs:
    - job: Build
      displayName: Bild the asp.net project and test project
      pool:
        vmImage: ubuntu-latest
      steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '$(dotnetSdkVersion)'
      - task: DotNetCoreCLI@2
        inputs:
          command: 'restore'
          projects: '$(solution)'
          feedsToUse: 'select'
      - task: DotNetCoreCLI@2
        inputs:
          command: 'build'
          projects: '$(solution)'
          arguments: '-c Release --no-restore'
      - task: DotNetCoreCLI@2
        inputs:
          command: 'publish'
          publishWebProjects: true
          arguments: '-c Release -o $(publishOutput)'
          zipAfterPublish: false

            # after dotnet publish and BEFORE PublishBuildArtifacts
      - script: |
          echo "Copy Dockerfile and image context into artifact staging"
          mkdir -p $(Build.ArtifactStagingDirectory)/src/TaskTracker.Api
          cp $(Build.SourcesDirectory)/src/TaskTracker.Api/Dockerfile $(Build.ArtifactStagingDirectory)/src/TaskTracker.Api/Dockerfile
          # copy any files the Dockerfile's COPY needs (adjust as required)
          cp -r $(Build.SourcesDirectory)/src/TaskTracker.Api/obj $(Build.ArtifactStagingDirectory)/src/TaskTracker.Api/ || true
        displayName: 'Copy Dockerfile into artifact staging'


      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: '$(artifactName)'
          publishLocation: 'Container'

- stage: Test
  dependsOn: Build_project
  jobs:
    - job: Test
      displayName: Test the asp.net project and test project
      pool:
        vmImage: $(vmImage)
      steps:
      - task: UseDotNet@2
        displayName: 'Install .NET SDK $(dotnetSdkVersion)'
        inputs:
          packageType: 'sdk'
          version: $(dotnetSdkVersion)

      - task: DownloadPipelineArtifact@2
        displayName: Download published artifact
        inputs:
          artifactName: $(artifactName)
          path: '$(Pipeline.Workspace)/drop'

      - script: mkdir -p $(testResultsDir)
        displayName: 'Prepare test results dir'

      - task: DotNetCoreCLI@2
        displayName: "Run Tests"
        inputs:
          command: 'test'
          projects: '**/*Tests/*.csproj'
          arguments: '--logger "trx;LogFileName=$(testResultsDir)/test-results.trx"'
          publishTestResults: false

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'VStest'
          testResultsFiles: 'test-results.trx'
          searchFolder: '$(testResultsDir)'
          mergeTestResults: true
          failTaskOnFailedTests: true

- stage: Build_Image
  displayName: Build image
  dependsOn: Test
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImage)
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download build artifact (drop)'
      inputs:
        artifact: $(artifactName)
        path: '$(Pipeline.Workspace)/drop'

    - script: |
        echo "Preparing Docker image context..."
        mkdir -p $(Pipeline.Workspace)/image-context
        # Copy published output and copied repo files into image-context
        cp -r $(Pipeline.Workspace)/drop/* $(Pipeline.Workspace)/image-context/
        # Ensure Dockerfile is at the root of image-context for a simple path
        if [ -f "$(Pipeline.Workspace)/image-context/src/TaskTracker.Api/Dockerfile" ]; then
          cp "$(Pipeline.Workspace)/image-context/src/TaskTracker.Api/Dockerfile" "$(Pipeline.Workspace)/image-context/Dockerfile"
        fi
      displayName: 'Prepare Docker build context'

       # If you want to build only (no push) you can let this step run (condition below allows both).
    - task: Docker@2
      displayName: 'Build Docker image (local)'
      condition: eq(variables['pushImage'], 'false')
      inputs:
        command: build
        dockerfile: '$(Pipeline.Workspace)/image-context/$(dockerfilePath)'
        buildContext: '$(Pipeline.Workspace)/image-context'
        tags: |
          $(imageTag)

    # Build and push to ACR when pushImage == 'true'
    - task: Docker@2
      displayName: 'Build and push Docker image to ACR'
      condition: eq(variables['pushImage'], 'true')
      inputs:
        command: buildAndPush
        containerRegistry: $(acrServiceConnection)
        repository: $(imageRepository)
        dockerfile: '$(Pipeline.Workspace)/image-context/$(dockerfilePath)'
        buildContext: '$(Pipeline.Workspace)/image-context'
        tags: |
          $(imageTag)
          latest

    - script: |
        echo "##vso[task.setvariable variable=fullImageName]$(imageRepository):$(imageTag)"
      displayName: 'Set fullImageName variable'
      condition: succeeded()
